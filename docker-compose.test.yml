services:
  db-test:
    image: postgres:16-alpine
    container_name: time2ship-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: time2ship_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data

  api-test:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
      target: builder
    container_name: time2ship-api-test
    environment:
      NODE_ENV: test
      PORT: 3001
      DB_HOST: db-test
      DB_PORT: 5432
      DB_NAME: time2ship_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_ACCESS_SECRET: test-access-secret-for-e2e-testing-only
      JWT_REFRESH_SECRET: test-refresh-secret-for-e2e-testing-only
    ports:
      - "3002:3001"
    volumes:
      - ./apps/api:/app
      - /app/node_modules
      - /app/dist
    depends_on:
      db-test:
        condition: service_healthy
    command: sh -c "npm run db:migrate && npm run test:e2e:local"

volumes:
  postgres_test_data:
