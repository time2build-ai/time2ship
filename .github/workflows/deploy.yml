name: deploy

on:
  push:
    branches: [production]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  API_IMAGE: ${{ secrets.DOCKERHUB_API_IMAGE }}
  CLIENT_IMAGE: ${{ secrets.DOCKERHUB_CLIENT_IMAGE }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr,prefix=pr-
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          no-cache: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          platforms: linux/amd64

      - name: Extract metadata for Client
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CLIENT_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr,prefix=pr-
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Client image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/client
          push: true
          no-cache: true
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
          platforms: linux/amd64

      - name: Trigger Dokploy deployment webhook
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/production'
        run: |
          # Prepare commit message with proper escaping
          COMMIT_MESSAGE=$(echo '${{ github.event.head_commit.message || github.event.commits[0].message || 'Manual deployment' }}' | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g' | sed "s/'/\\'/g")
          AUTHOR_NAME=$(echo '${{ github.event.head_commit.author.name || github.actor }}' | sed 's/"/\\"/g')
          AUTHOR_EMAIL='${{ github.event.head_commit.author.email || 'action@github.com' }}'

          # Trigger the Dokploy webhook with proper GitHub push event format
          curl -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-GitHub-Delivery: ${{ github.run_id }}" \
            -d "{
              \"ref\": \"${{ github.ref }}\",
              \"repository\": {
                \"name\": \"${{ github.event.repository.name }}\",
                \"full_name\": \"${{ github.repository }}\",
                \"clone_url\": \"${{ github.event.repository.clone_url }}\",
                \"ssh_url\": \"${{ github.event.repository.ssh_url }}\"
              },
              \"head_commit\": {
                \"id\": \"${{ github.sha }}\",
                \"message\": \"${COMMIT_MESSAGE}\",
                \"timestamp\": \"${{ github.event.head_commit.timestamp }}\",
                \"author\": {
                  \"name\": \"${AUTHOR_NAME}\",
                  \"email\": \"${AUTHOR_EMAIL}\"
                }
              },
              \"pusher\": {
                \"name\": \"${{ github.actor }}\",
                \"email\": \"action@github.com\"
              }
            }"
          echo "Dokploy deployment webhook triggered for commit: ${{ github.sha }}"
